name: chess

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Issue title to use for the chess move"
        required: false
        default: "Chess: manual run"
      issue_author:
        description: "Author name to use for the generated commit"
        required: false
        default: "manual-run"

jobs:
  move:
    permissions: write-all
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Chess:')

    steps:
      - uses: actions/checkout@v3

      - name: Setting up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Play chess
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          pip install -r requirements.txt
          python main.py

      - name: Commit and push changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.issue_title || 'Chess: manual run' }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login || inputs.issue_author || 'manual-run' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${ISSUE_TITLE} by ${ISSUE_AUTHOR}"
          git push

      - name: Chess board generation
        run: |
          npm i
          node main.js

      - name: Commit changes again
        run: |
          git config --global user.name "Panda"
          git config --global user.email "aifos.si.prahs@gmail.com"
          git add .
          git commit -m "chess img"
          git push
